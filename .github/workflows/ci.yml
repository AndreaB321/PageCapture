name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Cache MarkItDown runtime
        uses: actions/cache@v4
        with:
          path: |
            build/tools/markitdown
            build/tools-cache/markitdown.stamp
            build/tools-cache/markitdown.tree
            build/notices
          key: markitdown-${{ runner.os }}-${{ hashFiles('scripts/fetch-tools.sh', 'scripts/tool-pins.sh', 'scripts/markitdown-requirements.txt') }}
      - name: MarkItDown runtime
        run: |
          command -v zstd >/dev/null || brew install zstd
          scripts/fetch-tools.sh markitdown
      - name: Build
        run: swift build --build-tests
      # ToolsTests and VideoDownloaderTests skip themselves without ffmpeg etc. in build/tools
      # (scripts/fetch-tools.sh builds ffmpeg from source; CI only has build/tools/markitdown).
      - name: OCR sandbox diagnostics (temporary)
        run: scripts/ci-ocr-diag.sh
      - name: Test XCTest (temporary filter)
        timeout-minutes: 8
        env:
          NSUnbufferedIO: "YES"
        run: swift test --disable-swift-testing --filter 'OCRHelperTests|DocumentConverterTests'
      - name: Test Swift Testing (temporary filter)
        if: always()
        timeout-minutes: 5
        run: swift test --disable-xctest --filter PDFTextRecognizerTests
