name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build --build-tests
      # ToolsTests and VideoDownloaderTests skip themselves without build/tools (scripts/fetch-tools.sh,
      # which builds ffmpeg from source); everything else runs.
      - name: Test
        run: swift test
